<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful — ChatGenius</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        html { font-size: 90%; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Outfit', sans-serif;
            background:#F9FAFB;
            color: #1A1A2E;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 50% 40%, rgba(229,231,235,1) 0%, transparent 60%);
            pointer-events: none;
        }
        .success-card {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 480px;
            width: 100%;
            background: rgba(255,255,255,1);
            border: 1px solid rgba(229,231,235,1);
            border-radius: 8px;
            padding: 3rem 2.5rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.06);
        }
        .success-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(16,185,129,0.1);
            border: 2px solid rgba(16,185,129,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            animation: popIn 0.5s ease;
        }
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.15); }
            100% { transform: scale(1); opacity: 1; }
        }
        .success-icon svg { width: 36px; height: 36px; }
        h1 {
            font-size: 1.5rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
            color: #1A1A2E;
        }
        .success-text {
            font-size: 0.95rem;
            color: #6B7280;
            margin-bottom: 0.5rem;
            line-height: 1.5;
        }
        .success-plan {
            display: inline-block;
            padding: 0.4rem 1.2rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: linear-gradient(135deg, rgba(229,231,235,1), rgba(229,231,235,1));
            color: #1A1A2E;
            margin: 1rem 0;
        }
        .success-btn {
            display: inline-block;
            padding: 0.8rem 2rem;
            border-radius: 6px;
            background: linear-gradient(135deg, #8B5CF6, #7C3AED, #6D28D9);
            color: #FFFFFF;
            font-size: 0.95rem;
            font-weight: 700;
            font-family: 'Outfit', sans-serif;
            text-decoration: none;
            margin-top: 1rem;
            transition: transform .2s, box-shadow .2s;
            box-shadow: 0 4px 25px rgba(209,213,219,1);
        }
        .success-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 35px rgba(156,163,175,1);
        }
    </style>
</head>
<body>
    <div class="success-card">
        <div class="success-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </div>
        <h1>Payment Successful!</h1>
        <p class="success-text">Your plan has been upgraded. All premium features are now unlocked.</p>
        <div class="success-plan" id="planBadge">Loading...</div>
        <br>
        <a href="/user-dashboard" class="success-btn">Go to Dashboard</a>
    </div>

    <script>
        var PLAN_LABELS = { basic: 'Basic Plan', growth: 'Growth Plan', pro: 'Pro Plan', enterprise: 'Enterprise Plan' };
        var params = new URLSearchParams(window.location.search);
        var plan = params.get('plan');
        var token = localStorage.getItem('token') || '';
        var subscriptionId = params.get('subscription_id') || sessionStorage.getItem('paypal_subscription_id') || '';
        var badge = document.getElementById('planBadge');

        if (plan && PLAN_LABELS[plan]) {
            badge.textContent = PLAN_LABELS[plan];
        } else {
            badge.textContent = 'Plan Upgraded';
        }

        // Activate subscription on return from PayPal
        if (subscriptionId && token) {
            badge.textContent = 'Activating...';
            fetch('/api/paypal/activate-subscription', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({ subscription_id: subscriptionId })
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                sessionStorage.removeItem('paypal_subscription_id');
                if (data.ok) {
                    badge.textContent = PLAN_LABELS[plan] || 'Plan Upgraded';
                    try {
                        var u = JSON.parse(localStorage.getItem('user') || '{}');
                        u.plan = plan;
                        localStorage.setItem('user', JSON.stringify(u));
                    } catch(e) {}
                } else {
                    badge.textContent = data.error || 'Activation pending';
                    badge.style.color = '#6B7280';
                }
            })
            .catch(function() {
                badge.textContent = 'Activation pending — check dashboard';
                badge.style.color = '#6B7280';
            });
        }
    </script>
<script src="/static/support-bot.js"></script>
</body>
</html>

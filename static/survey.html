<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rate Your Experience</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
html{font-size:90%}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Outfit','Inter',sans-serif;background:#0a0a0a;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;color:#e5e7eb;}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
.card{background:#0a0a0a;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius: 8px;padding:48px;max-width:500px;width:100%;border:1px solid #2a2a2e;box-shadow:0 4px 16px rgba(0,0,0,0.3);text-align:center;position:relative;z-index:1;}
h1{font-size:24px;margin-bottom:8px;color:#e5e7eb;}
p{color:#6B7280;margin-bottom:24px;line-height:1.5;}
.stars{display:flex;justify-content:center;gap:12px;margin:24px 0;}
.star{font-size:48px;cursor:pointer;transition:transform 0.2s;text-decoration:none;padding:8px;border-radius:12px;color:#e5e7eb;}
.star:hover{transform:scale(1.2);background:#1a1a1e;}
.feedback-section{display:none;margin-top:24px;}
textarea{width:100%;padding:12px;border:1px solid #2a2a2e;border-radius:12px;font-size:14px;font-family:'Outfit','Inter',sans-serif;resize:vertical;min-height:80px;background:#141417;color:#e5e7eb;outline:none;transition:border-color 0.2s,box-shadow 0.2s;}
textarea:focus{border-color:#3a3a3e;box-shadow:0 0 0 4px rgba(99,102,241,0.2);}
textarea::placeholder{color:#6B7280;}
.btn{display:inline-block;padding:12px 32px;border:none;border-radius: 6px;font-size:15px;font-weight:600;cursor:pointer;font-family:'Outfit','Inter',sans-serif;background:rgba(99,102,241,0.9);color:#FFFFFF;margin-top:16px;box-shadow:0 4px 25px rgba(99,102,241,0.3);transition:all 0.2s;}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 35px rgba(10,10,10,0.4);}
.thank-you{display:none;}

/* ═══ NEON BUTTONS (Global) ═══ */
.btn-neon{position:relative;display:inline-flex;align-items:center;gap:.5rem;color:#FFFFFF;padding:.85rem 2.2rem;border-radius:9999px;font-weight:600;text-decoration:none;font-size:.95rem;border:1px solid rgba(99,102,241,0.3);cursor:pointer;font-family:inherit;background:rgba(99,102,241,0.9);transition:all .4s cubic-bezier(0.22,1,0.36,1);overflow:hidden;box-shadow:0 0 20px rgba(99,102,241,0.15)}
.btn-neon::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(165,180,252,0.8),transparent);opacity:0;transition:opacity .5s;width:75%;margin:auto}
.btn-neon::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(99,102,241,0.6),transparent);opacity:.3;width:75%;margin:auto;transition:opacity .5s}
.btn-neon:hover{background:rgba(99,102,241,1);border-color:rgba(99,102,241,0.5);transform:translateY(-2px);box-shadow:0 0 35px rgba(99,102,241,0.3),0 4px 15px rgba(99,102,241,0.2);color:#FFFFFF}
.btn-neon:hover::before{opacity:1}
.btn-neon:hover::after{opacity:.7}
.btn-neon.neon-outline{background:transparent;color:#4F46E5;border-color:rgba(99,102,241,0.3);box-shadow:none}
.btn-neon.neon-outline:hover{background:rgba(99,102,241,0.08);color:#4338CA;border-color:rgba(99,102,241,0.5);box-shadow:0 0 25px rgba(99,102,241,0.12)}
</style>
</head>
<body>
<div class="card" id="surveyCard">
    <h1>How was your experience?</h1>
    <p>Your feedback helps us improve our service</p>
    <div class="stars" id="starsContainer"></div>
    <div class="feedback-section" id="feedbackSection">
        <textarea id="feedbackText" placeholder="Tell us more about your experience (optional)..."></textarea>
        <button class="btn" onclick="submitSurvey()">Submit Feedback</button>
    </div>
</div>
<div class="card thank-you" id="thankYou">
    <h1 style="color:#6B7280;">Thank You!</h1>
    <p>Your feedback has been recorded.</p>
    <p id="redirectMsg" style="display:none;">Redirecting you to Google Reviews...</p>
</div>
<script>
const token = new URLSearchParams(window.location.search).get('token') || window.location.pathname.split('/').pop();
let selectedRating = 0;
const starsEl = document.getElementById('starsContainer');
for (let i = 1; i <= 5; i++) {
    const s = document.createElement('a');
    s.className = 'star';
    s.href = '#';
    s.textContent = i <= selectedRating ? '\u2B50' : '\u2606';
    s.onclick = (e) => { e.preventDefault(); selectRating(i); };
    starsEl.appendChild(s);
}
function selectRating(r) {
    selectedRating = r;
    document.querySelectorAll('.star').forEach((s, idx) => { s.textContent = idx < r ? '\u2B50' : '\u2606'; });
    document.getElementById('feedbackSection').style.display = 'block';
}
async function submitSurvey() {
    const feedback = document.getElementById('feedbackText').value;
    try {
        const r = await fetch('/api/survey/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, rating: selectedRating, feedback })
        }).then(r => r.json());
        document.getElementById('surveyCard').style.display = 'none';
        document.getElementById('thankYou').style.display = 'block';
        if (r.redirect_to_google && r.google_review_url) {
            document.getElementById('redirectMsg').style.display = 'block';
            setTimeout(() => { window.location.href = r.google_review_url; }, 2000);
        }
    } catch (e) { alert('Error submitting survey'); }
}
</script>
</body>
</html>
